openapi: 3.0.3
info:
  title: TutorLink API
  version: 0.1.0
  description: Foundation contract for Auth, File, and Marketplace Listing flows.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: http://127.0.0.1:8000
    description: Local Docker development
tags:
  - name: Auth
    description: Registration, login, logout, and current-user session operations.
  - name: Files
    description: Private file metadata and upload operations.
  - name: Catalog
    description: Read-only categories and specialization catalog data.
  - name: Tutor Profile
    description: Tutor draft and submission profile operations.
  - name: Listings
    description: Public marketplace search and tutor listing management.
paths:
  /sanctum/csrf-cookie:
    get:
      operationId: initializeCsrfCookie
      tags: [Auth]
      summary: Initialize the Sanctum SPA cookie flow
      security: []
      responses:
        "204":
          description: CSRF cookie issued.
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer or tutor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      operationId: register
      security: []
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Start an authenticated SPA session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      operationId: login
      security: []
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Request a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset request accepted.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Reset a password with a valid token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      operationId: verifyEmail
      tags: [Auth]
      summary: Verify the authenticated user's email address
      security: [{ sanctumCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the current SPA session
      security: [{ sanctumCookie: [] }]
      responses:
        "204":
          description: Session ended.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/email/verification-notification:
    post:
      operationId: resendVerification
      tags: [Auth]
      summary: Resend the email verification notification
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Verification notification dispatched.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Return the authenticated user
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateCurrentUser
      tags: [Auth]
      summary: Update the authenticated user's editable profile fields
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/files:
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload a private file and store its metadata
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "201":
          description: File metadata created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          description: File is too large.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/files/{file}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      operationId: getFile
      tags: [Files]
      summary: Return file metadata when the viewer is authorized
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Remove an unlinked file owned by the current user
      security: [{ sanctumCookie: [] }]
      responses:
        "204":
          description: File removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: File is linked to a business record.

  /api/v1/files/{file}/complete:
    post:
      operationId: completeFile
      tags: [Files]
      summary: Mark an uploaded file as complete
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/files/{file}/links:
    post:
      operationId: linkFile
      tags: [Files]
      summary: Attach a completed file to a business resource
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileLinkRequest"
      responses:
        "200":
          description: File link created or updated.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: File must be complete before attaching.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/files/{file}/download:
    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download a completed file owned by the current user
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: File is not complete.

  /api/v1/catalog/categories:
    get:
      operationId: listCatalogCategories
      tags: [Catalog]
      summary: Read active catalog categories and specializations
      security: []
      responses:
        "200":
          description: Active catalog tree.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/specializations:
    get:
      operationId: listSpecializations
      tags: [Catalog]
      summary: Read active specializations
      security: []
      responses:
        "200":
          description: Active specialization collection.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tutor/profile:
    get:
      operationId: getTutorProfile
      tags: [Tutor Profile]
      summary: Return the current tutor profile
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Tutor profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: upsertTutorProfile
      tags: [Tutor Profile]
      summary: Create or update a tutor draft profile
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorProfileWriteRequest"
      responses:
        "201":
          description: Draft profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileResponse"
        "200":
          description: Draft profile updated.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Submitted profile cannot be edited.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tutor/profile/submit:
    post:
      operationId: submitTutorProfile
      tags: [Tutor Profile]
      summary: Submit the current tutor draft for review
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Profile submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/listings:
    get:
      tags: [Listings]
      summary: Search public service listings
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: specialization_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: delivery_mode
          in: query
          schema: { type: string, enum: [online, in_person, hybrid] }
      operationId: searchListings
      security: []
      responses:
        "200":
          description: Public listing collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingCollection"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/listings/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getListingBySlug
      tags: [Listings]
      summary: Return a public listing by slug
      security: []
      responses:
        "200":
          description: Public listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/me/listings:
    get:
      operationId: listMyListings
      tags: [Listings]
      summary: List the current tutor's listings
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Tutor listing collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createListing
      tags: [Listings]
      summary: Create a draft service listing
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingWriteRequest"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/me/listings/{listing}:
    parameters:
      - name: listing
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getMyListing
      tags: [Listings]
      summary: Return one listing owned by the current tutor
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateListing
      tags: [Listings]
      summary: Update a draft listing
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingWriteRequest"
      responses:
        "200":
          description: Updated listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Listing is locked by its current state.
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteListing
      tags: [Listings]
      summary: Delete a draft listing
      security: [{ sanctumCookie: [] }]
      responses:
        "204":
          description: Listing deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Active or referenced listing cannot be deleted.

components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: tutorlink-session
  parameters:
    FileId:
      name: file
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    TooManyRequests:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    User:
      type: object
      required: [id, role, status, full_name, email]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [customer, tutor, admin] }
        status: { type: string, enum: [pending, active, suspended, cancelled] }
        full_name: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        date_of_birth: { type: string, format: date, nullable: true }
        email_verified_at: { type: string, format: date-time, nullable: true }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/User" }
    RegisterRequest:
      type: object
      required: [full_name, email, password, password_confirmation, role]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }
        role: { type: string, enum: [customer, tutor] }
        date_of_birth: { type: string, format: date }
        terms_version: { type: string, maxLength: 32 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        remember: { type: boolean, default: false }
    UpdateMeRequest:
      type: object
      properties:
        full_name: { type: string, minLength: 2, maxLength: 255 }
        date_of_birth: { type: string, format: date }
    File:
      type: object
      required:
        [
          id,
          owner_id,
          original_name,
          mime_type,
          size_bytes,
          scan_status,
          purpose,
          complete,
          created_at,
        ]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        owner_id: { type: integer, format: int64, minimum: 1 }
        original_name: { type: string, nullable: true }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        purpose:
          {
            type: string,
            enum: [avatar, verification_document, task_attachment, profile_document],
          }
        scan_status: { type: string, enum: [pending, clean, rejected] }
        complete: { type: boolean }
        created_at: { type: string, format: date-time }
    FileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/File" }
    FileUploadRequest:
      type: object
      required: [file, purpose]
      properties:
        file: { type: string, format: binary }
        purpose:
          {
            type: string,
            enum: [avatar, verification_document, task_attachment, profile_document],
          }
    FileLinkRequest:
      type: object
      required: [resource_type, resource_id]
      properties:
        resource_type:
          {
            type: string,
            enum: [message, task, task_submission, announcement, verification_document],
          }
        resource_id: { type: integer, minimum: 1 }
        purpose: { type: string, maxLength: 50, nullable: true }
    TutorProfile:
      type: object
      required: [id, user_id, headline, experience_years, status, approval_status]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        user_id: { type: integer, format: int64, minimum: 1 }
        headline: { type: string, maxLength: 160 }
        bio: { type: string, nullable: true }
        experience_years: { type: integer, minimum: 0, maximum: 80 }
        status: { type: string, enum: [draft, submitted] }
        approval_status: { type: string, enum: [pending, active, rejected, cancelled, expired] }
        submitted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TutorProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/TutorProfile" }
    TutorProfileWriteRequest:
      type: object
      required: [headline]
      properties:
        headline: { type: string, maxLength: 160 }
        bio: { type: string, nullable: true }
        experience_years: { type: integer, minimum: 0, maximum: 80 }
    Listing:
      type: object
      required:
        [
          id,
          tutor_profile_id,
          specialization_id,
          slug,
          title,
          description,
          delivery_mode,
          price_from_minor,
          currency,
          price_unit,
          status,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        tutor_profile_id: { type: integer, format: int64, minimum: 1 }
        specialization_id: { type: integer, format: int64, minimum: 1 }
        slug: { type: string, maxLength: 180 }
        title: { type: string, maxLength: 180 }
        description: { type: string }
        delivery_mode: { type: string, enum: [online, in_person, hybrid] }
        city: { type: string, nullable: true }
        district: { type: string, nullable: true }
        price_from_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, example: VND }
        price_unit: { type: string, example: session }
        status: { type: string, enum: [draft, active, paused, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Listing" }
    ListingCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Listing" }
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ListingWriteRequest:
      type: object
      required:
        [
          specialization_id,
          title,
          description,
          delivery_mode,
          price_from_minor,
          currency,
          price_unit,
        ]
      properties:
        specialization_id: { type: integer, minimum: 1 }
        title: { type: string, minLength: 3, maxLength: 180 }
        description: { type: string, minLength: 1 }
        delivery_mode: { type: string, enum: [online, in_person, hybrid] }
        city: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        price_from_minor: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, example: VND }
        price_unit: { type: string, maxLength: 30 }
    PaginationMeta:
      type: object
      required: [current_page, per_page, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        request_id: { type: string, format: uuid, nullable: true }
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
