openapi: 3.0.3
info:
  title: TutorLink API
  version: 0.1.0
  description: Foundation contract for Auth, File, and Marketplace Listing flows.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: http://127.0.0.1:8000
    description: Local Docker development
tags:
  - name: Admin
    description: Permission-based tutor review and independent profile/account suspension with transactional audit.
  - name: Auth
    description: Registration, login, logout, and current-user session operations.
  - name: Files
    description: Private file metadata and upload operations.
  - name: Catalog
    description: Read-only categories and specialization catalog data.
  - name: Tutor Profile
    description: Tutor draft and submission profile operations.
  - name: Listings
    description: Public marketplace search and tutor listing management.
paths:
  /sanctum/csrf-cookie:
    get:
      operationId: initializeCsrfCookie
      tags: [Auth]
      summary: Initialize the Sanctum SPA cookie flow
      security: []
      responses:
        "204":
          description: CSRF cookie issued.
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer or tutor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      operationId: register
      security: []
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Start an authenticated SPA session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      operationId: login
      security: []
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Request a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset request accepted.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Reset a password with a valid token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      operationId: verifyEmail
      tags: [Auth]
      summary: Verify an email address using a public signed link
      description: Session authentication is not required; invalid or expired signed links return 403.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the current SPA session
      security: [{ sanctumCookie: [] }]
      responses:
        "204":
          description: Session ended.

        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/email/verification-notification:
    post:
      operationId: resendVerification
      tags: [Auth]
      summary: Resend the email verification notification
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Verification notification dispatched.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Return the authenticated user
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateCurrentUser
      tags: [Auth]
      summary: Update the authenticated user's editable profile fields
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/files:
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload a private file and store its metadata
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "201":
          description: File metadata created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: File is too large.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/files/{file}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      operationId: getFile
      tags: [Files]
      summary: Return file metadata when the viewer is authorized
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Remove an unlinked file owned by the current user
      security: [{ sanctumCookie: [] }]
      responses:
        "204":
          description: File removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: File is linked to a business record.

  /api/v1/files/{file}/complete:
    post:
      operationId: completeFile
      tags: [Files]
      summary: Complete an upload after checking stored size MIME and SHA256
      description: Missing, rejected, or metadata-mismatched files return 409; clean marks upload eligibility and does not imply antivirus scanning.
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

        "409":
          description: Uploaded object is missing rejected or does not match its stored metadata.

  /api/v1/files/{file}/links:
    post:
      operationId: linkFile
      tags: [Files]
      summary: Link a completed file to its authorized verification document
      description: In phase 2 only verification_document is supported. The document must already reference this file and belong to an editable profile of the caller; other resource types return 409 until their authorization slices are implemented.
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileLinkRequest"
      responses:
        "200":
          description: File link created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileLinkResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: File is incomplete the profile is locked or the resource type is not implemented.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/files/{file}/download:
    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download an owner file or an authorized reviewer verification document
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: File is not complete.

  /api/v1/catalog/categories:
    get:
      operationId: listCatalogCategories
      tags: [Catalog]
      summary: Read active catalog categories and specializations
      security: []
      responses:
        "200":
          description: Active catalog tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCategoryCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/catalog/specializations:
    get:
      operationId: listSpecializations
      tags: [Catalog]
      summary: Read active specializations
      security: []
      responses:
        "200":
          description: Active specialization collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecializationCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tutor/profile:
    get:
      operationId: getTutorProfile
      tags: [Tutor Profile]
      summary: Return the current tutor profile
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Tutor profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: upsertTutorProfile
      tags: [Tutor Profile]
      summary: Create or update a tutor draft profile
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorProfileWriteRequest"
      responses:
        "201":
          description: Draft profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileResponse"
        "200":
          description: Draft profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Submitted profile cannot be edited.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tutor/profile/submit:
    post:
      operationId: submitTutorProfile
      tags: [Tutor Profile]
      summary: Submit the current tutor draft for review
      description: Requires active verified Tutor, headline, bio, active specialization, completed owned avatar and at least one completed owned verification document with storage present. Draft remains editable after 422; retry of Submitted returns its persisted state.
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Profile submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"


  /api/v1/tutor/profile/avatar:
    put:
      operationId: attachTutorAvatar
      tags: [Tutor Profile]
      summary: Attach a completed avatar file to the current tutor profile
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachTutorAvatarRequest"
      responses:
        "200":
          description: Avatar attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Profile or file is not in an attachable state.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tutor/profile/verification-documents:
    post:
      operationId: createTutorVerificationDocument
      tags: [Tutor Profile]
      summary: Attach a completed verification document to the current tutor profile
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDocumentRequest"
      responses:
        "200":
          description: Verification document updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocumentResponse"
        "201":
          description: Verification document attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocumentResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Profile or file is not in an attachable state.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/listings:
    get:
      tags: [Listings]
      summary: Search public service listings
      description: Planned W1-A3 contract; this route is not implemented in the phase 2 runtime.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: specialization_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: delivery_mode
          in: query
          schema: { type: string, enum: [online, offline, hybrid] }
      operationId: searchListings
      security: []
      responses:
        "200":
          description: Public listing collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingCollection"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/listings/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getListingBySlug
      tags: [Listings]
      summary: Return a public listing by slug
      description: Planned W1-A3 contract; this route is not implemented in the phase 2 runtime.
      security: []
      responses:
        "200":
          description: Public listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/me/listings:
    get:
      operationId: listMyListings
      tags: [Listings]
      summary: List the current tutor's listings
      description: Planned W1-A3 contract; this route is not implemented in the phase 2 runtime.
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Tutor listing collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createListing
      tags: [Listings]
      summary: Create a draft service listing
      description: Planned W1-A3 contract; this route is not implemented in the phase 2 runtime.
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingWriteRequest"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/me/listings/{listing}:
    parameters:
      - name: listing
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getMyListing
      tags: [Listings]
      summary: Return one listing owned by the current tutor
      description: Planned W1-A3 contract; this route is not implemented in the phase 2 runtime.
      security: [{ sanctumCookie: [] }]
      responses:
        "200":
          description: Listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateListing
      tags: [Listings]
      summary: Update a draft listing
      description: Planned W1-A3 contract; this route is not implemented in the phase 2 runtime.
      security: [{ sanctumCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingWriteRequest"
      responses:
        "200":
          description: Updated listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Listing is locked by its current state.
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteListing
      tags: [Listings]
      summary: Delete a draft listing
      description: Planned W1-A3 contract; this route is not implemented in the phase 2 runtime.
      security: [{ sanctumCookie: [] }]
      responses:
        "204":
          description: Listing deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Active or referenced listing cannot be deleted.

  /api/v1/admin/tutor-profiles:
    get:
      operationId: listAdminTutorProfiles
      tags: [Admin]
      summary: List submitted tutor profiles for authorized reviewers
      security: [{ sanctumCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, changes_requested, active, rejected], default: pending }
      responses:
        "200":
          description: Submitted profiles with per-actor allowed actions; drafts are excluded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminTutorProfile" } }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tutor-profiles/{tutorProfile}:
    get:
      operationId: getAdminTutorProfile
      tags: [Admin]
      summary: Read a tutor profile with independently authorized verification documents
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TutorProfileId"
      responses:
        "200":
          description: Authorized profile detail; verification_documents is null without download permission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTutorProfileResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/tutor-profiles/{tutorProfile}/approve:
    post:
      operationId: approveTutorProfile
      tags: [Admin]
      summary: Approve a submitted profile
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TutorProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDecisionRequest" }
      responses:
        "200":
          description: Decision and audit committed together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTutorProfileResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resource state no longer permits this action.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tutor-profiles/{tutorProfile}/request-changes:
    post:
      operationId: requestTutorProfileChanges
      tags: [Admin]
      summary: Request profile changes
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TutorProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDecisionRequest" }
      responses:
        "200":
          description: Decision and audit committed together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTutorProfileResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resource state no longer permits this action.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tutor-profiles/{tutorProfile}/reject:
    post:
      operationId: rejectTutorProfile
      tags: [Admin]
      summary: Reject a submitted profile
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TutorProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDecisionRequest" }
      responses:
        "200":
          description: Decision and audit committed together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTutorProfileResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resource state no longer permits this action.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tutor-profiles/{tutorProfile}/suspend:
    post:
      operationId: suspendTutorProfile
      tags: [Admin]
      summary: Suspend a tutor profile independently of the account
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TutorProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDecisionRequest" }
      responses:
        "200":
          description: Decision and audit committed together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTutorProfileResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resource state no longer permits this action.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/tutor-profiles/{tutorProfile}/restore:
    post:
      operationId: restoreTutorProfile
      tags: [Admin]
      summary: Restore a suspended tutor profile
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TutorProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDecisionRequest" }
      responses:
        "200":
          description: Decision and audit committed together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTutorProfileResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resource state no longer permits this action.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/users/{user}/suspend:
    post:
      operationId: suspendAccount
      tags: [Admin]
      summary: Suspend an active account
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDecisionRequest" }
      responses:
        "200":
          description: Decision and audit committed together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resource state no longer permits this action.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/users/{user}/restore:
    post:
      operationId: restoreAccount
      tags: [Admin]
      summary: Restore an inactive account
      security: [{ sanctumCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDecisionRequest" }
      responses:
        "200":
          description: Decision and audit committed together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resource state no longer permits this action.
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: tutorlink-session
  parameters:
    TutorProfileId:
      name: tutorProfile
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    UserId:
      name: user
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    FileId:
      name: file
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    TooManyRequests:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    AdminDecisionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 2, maxLength: 2000 }
    AdminTutorProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AdminTutorProfile" }
    AdminTutorProfile:
      type: object
      required: [user, profile, allowed_actions, verification_documents]
      properties:
        user: { $ref: "#/components/schemas/User" }
        profile: { $ref: "#/components/schemas/TutorProfile" }
        allowed_actions:
          type: array
          items:
            type: string
            enum: [approve, request-changes, reject, suspend, restore, account-suspend, account-restore]
        verification_documents:
          type: array
          nullable: true
          items:
            type: object
            required: [id, tutor_profile_id, file_id, document_type, status, download_url]
            properties:
              id: { type: integer, minimum: 1 }
              tutor_profile_id: { type: integer, minimum: 1 }
              file_id: { type: integer, minimum: 1 }
              document_type: { type: string }
              status: { type: string, enum: [pending, active, rejected, expired] }
              reviewed_at: { type: string, nullable: true }
              original_name: { type: string, nullable: true }
              mime_type: { type: string }
              size_bytes: { type: integer, minimum: 0 }
              scan_status: { type: string, enum: [pending, clean, rejected] }
              download_url: { type: string, format: uri }
    User:
      type: object
      required: [id, role, status, full_name, email]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [customer, tutor, admin] }
        status: { type: string, enum: [draft, active, inactive, cancelled] }
        full_name: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        date_of_birth: { type: string, format: date, nullable: true }
        email_verified_at: { type: string, format: date-time, nullable: true }
        profile:
          type: object
          nullable: true
          anyOf:
            - $ref: "#/components/schemas/CustomerProfile"
            - $ref: "#/components/schemas/TutorProfile"
            - type: object
              nullable: true
              enum: [null]
    CustomerProfile:
      type: object
      required: [id, user_id]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        user_id: { type: integer, format: int64, minimum: 1 }
        avatar_file_id:
          { type: integer, format: int64, minimum: 1, nullable: true }
        city: { type: string, nullable: true }
        district: { type: string, nullable: true }
        bio: { type: string, nullable: true }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/User" }
    RegisterRequest:
      type: object
      required:
        [full_name, email, password, password_confirmation, role, date_of_birth]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }
        role: { type: string, enum: [customer, tutor] }
        date_of_birth: { type: string, format: date }
        terms_version: { type: string, maxLength: 32 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        remember: { type: boolean, default: false }
    UpdateMeRequest:
      type: object
      properties:
        full_name: { type: string, minLength: 2, maxLength: 255 }
        date_of_birth: { type: string, format: date }
    File:
      type: object
      required:
        [
          id,
          owner_id,
          original_name,
          mime_type,
          size_bytes,
          scan_status,
          purpose,
          complete,
          created_at,
        ]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        owner_id: { type: integer, format: int64, minimum: 1 }
        original_name: { type: string, nullable: true }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        purpose:
          {
            type: string,
            enum:
              [
                avatar,
                verification_document,
                task_attachment,
                profile_document,
              ],
          }
        scan_status: { type: string, enum: [pending, clean, rejected] }
        complete: { type: boolean }
        created_at: { type: string, format: date-time }
    FileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/File" }
    FileUploadRequest:
      description: Avatar accepts JPG/PNG up to 2 MiB; other purposes accept PDF/JPG/PNG/DOC/DOCX up to 10 MiB. Non-avatar upload requires verified email.
      type: object
      required: [file, purpose]
      properties:
        file: { type: string, format: binary }
        purpose:
          {
            type: string,
            enum:
              [
                avatar,
                verification_document,
                task_attachment,
                profile_document,
              ],
          }
    FileLinkRequest:
      type: object
      required: [resource_type, resource_id]
      properties:
        resource_type:
          {
            type: string,
            enum:
              [
                message,
                task,
                task_submission,
                announcement,
                verification_document,
              ],
          }
        resource_id: { type: integer, minimum: 1 }
        purpose: { type: string, maxLength: 50, nullable: true }
    FileLinkResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [file_id, resource_type, resource_id, purpose]
          properties:
            file_id:
              type: integer
              format: int64
              minimum: 1
            resource_type:
              type: string
              enum:
                [
                  message,
                  task,
                  task_submission,
                  announcement,
                  verification_document,
                ]
            resource_id:
              type: integer
              format: int64
              minimum: 1
            purpose:
              type: string
              maxLength: 50
              nullable: true
    CatalogCategory:
      type: object
      required: [id, name, slug, status, sort_order, subcategories]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
        status:
          type: string
          enum: [active, inactive]
        sort_order:
          type: integer
          minimum: 0
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSubcategory"

    CatalogSubcategory:
      type: object
      required: [id, category_id, name, slug, status, specializations]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        category_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
        status:
          type: string
          enum: [active, inactive]
        specializations:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSpecialization"

    CatalogSpecialization:
      type: object
      required: [id, subcategory_id, name, slug, status]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        subcategory_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
        status:
          type: string
          enum: [active, inactive]
    CatalogCategoryCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCategory"

    SpecializationCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSpecialization"
    TutorProfile:
      type: object
      required:
        [
          id,
          user_id,
          specialization_id,
          avatar_file_id,
          verification_document_file_id,
          headline,
          experience_years,
          status,
          approval_status,
        ]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        user_id: { type: integer, format: int64, minimum: 1 }
        specialization_id: { type: integer, format: int64, minimum: 1, nullable: true }
        avatar_file_id:
          { type: integer, format: int64, minimum: 1, nullable: true }
        verification_document_file_id:
          { type: integer, format: int64, minimum: 1, nullable: true }
        headline: { type: string, maxLength: 160 }
        bio: { type: string, nullable: true }
        experience_years: { type: integer, minimum: 0, maximum: 80 }
        status:
          {
            type: string,
            enum: [draft, submitted, approved, changes_requested, rejected],
          }
        approval_status:
          { type: string, enum: [pending, changes_requested, active, rejected] }
        submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        review_reason:
          type: string
          nullable: true

        reviewed_by:
          type: integer
          format: int64
          minimum: 1
          nullable: true

        suspended_at:
          type: string
          format: date-time
          nullable: true

        suspension_reason:
          type: string
          nullable: true
    TutorProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/TutorProfile" }
    TutorProfileWriteRequest:
      type: object
      required: [headline, specialization_id]
      properties:
        headline: { type: string, maxLength: 160 }
        bio: { type: string, nullable: true }
        experience_years: { type: integer, minimum: 0, maximum: 80 }
        specialization_id: { type: integer, format: int64, minimum: 1 }
    AttachTutorAvatarRequest:
      type: object
      required: [file_id]
      properties:
        file_id: { type: integer, format: int64, minimum: 1 }
    VerificationDocumentRequest:
      type: object
      required: [file_id, document_type]
      properties:
        file_id: { type: integer, format: int64, minimum: 1 }
        document_type: { type: string, maxLength: 50 }
    VerificationDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, tutor_profile_id, file_id, document_type, status]
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            tutor_profile_id: { type: integer, format: int64, minimum: 1 }
            file_id: { type: integer, format: int64, minimum: 1 }
            document_type: { type: string }
            status: { type: string, enum: [pending, active, rejected, expired] }
    Listing:
      type: object
      required:
        [
          id,
          tutor_profile_id,
          specialization_id,
          slug,
          title,
          description,
          delivery_mode,
          price_from_minor,
          currency,
          price_unit,
          status,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        tutor_profile_id: { type: integer, format: int64, minimum: 1 }
        specialization_id: { type: integer, format: int64, minimum: 1 }
        slug: { type: string, maxLength: 180 }
        title: { type: string, maxLength: 180 }
        description: { type: string }
        delivery_mode: { type: string, enum: [online, offline, hybrid] }
        city: { type: string, nullable: true }
        district: { type: string, nullable: true }
        price_from_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, example: VND }
        price_unit: { type: string, example: session }
        status: { type: string, enum: [draft, active, inactive, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListingResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Listing" }
    ListingCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Listing" }
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ListingWriteRequest:
      type: object
      required:
        [
          specialization_id,
          title,
          description,
          delivery_mode,
          price_from_minor,
          currency,
          price_unit,
        ]
      properties:
        specialization_id: { type: integer, minimum: 1 }
        title: { type: string, minLength: 3, maxLength: 180 }
        description: { type: string, minLength: 1 }
        delivery_mode: { type: string, enum: [online, offline, hybrid] }
        city: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        price_from_minor: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, example: VND }
        price_unit: { type: string, maxLength: 30 }
    PaginationMeta:
      type: object
      required: [current_page, per_page, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        request_id: { type: string, format: uuid, nullable: true }
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
