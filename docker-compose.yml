services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutorlink
      POSTGRES_USER: tutorlink
      POSTGRES_PASSWORD: tutorlink_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorlink -d tutorlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tutorlink.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_password
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: tutorlink
      DB_USERNAME: tutorlink
      DB_PASSWORD: tutorlink_dev_password
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:3000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_SECONDS: 10
    volumes:
      - ./backend:/var/www/html
      - ./backend/.env.docker:/var/www/html/.env:ro
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/sanctum/csrf-cookie') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: "10M"
      CLAMD_CONF_MaxFileSize: "25M"
      CLAMD_CONF_MaxScanSize: "50M"
      CLAMD_CONF_MaxFiles: "1000"
      CLAMD_CONF_MaxRecursion: "10"
      CLAMD_CONF_MaxScanTime: "8000"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_ScanArchive: "yes"
      CLAMD_CONF_ScanOLE2: "yes"
      CLAMD_CONF_ScanPDF: "yes"
      CLAMD_CONF_ScanXMLDOCS: "yes"
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_MaxThreads: "2"
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 4g

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_DATA_MODE: api
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"

volumes:
  postgres_data:
  pgadmin_data:
  backend_vendor:
  backend_storage:
  frontend_node_modules:
  clamav_data: