x-runtime: &runtime
  image: tutorlink-backend:${RELEASE_TAG:?Set RELEASE_TAG}
  env_file: .env.production
  init: true
  restart: unless-stopped
  stop_grace_period: 120s
  volumes:
    - production_storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - production_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *runtime
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: app
    healthcheck:
      test: [CMD, php, -r, '$$s = @fsockopen("127.0.0.1", 9000, $$e, $$m, 2); exit(is_resource($$s) ? 0 : 1);']
      interval: 15s
      timeout: 5s
      retries: 3

  proxy:
    image: tutorlink-proxy:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: proxy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      APP_URL: ${APP_URL:?Set APP_URL}
      TLS_CONFIG: ${TLS_CONFIG:-}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  outbox-worker:
    <<: *runtime
    command: [php, artisan, 'outbox:work', '--sleep=2', '--limit=100']

  slack-worker:
    <<: *runtime
    environment:
      MONITORING_ALERTS_SUPPRESSED: "true"
    command: [php, artisan, 'queue:work', database, '--queue=slack', '--sleep=1', '--tries=10', '--timeout=20', '--max-time=3600']

  broadcast-worker:
    <<: *runtime
    command: [php, artisan, 'queue:work', database, '--queue=broadcasts', '--sleep=1', '--tries=3', '--timeout=30', '--max-time=3600']

  scheduler:
    <<: *runtime
    command: [php, artisan, 'schedule:work']

  reverb:
    <<: *runtime
    command: [php, artisan, 'reverb:start', '--host=0.0.0.0', '--port=8080']

volumes:
  production_db:
  production_storage:
  caddy_data:
  caddy_config:
