services:
  backend-test:
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
    ports:
      - 127.0.0.1:18006:8000
    volumes:
      - ./backend/d06-smoke.env:/var/www/html/.env:ro
    networks:
      - testing
      - d06-runtime

networks:
  d06-runtime:
    driver: bridge
