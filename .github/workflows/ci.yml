name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/2w-be-h01

permissions:
  contents: read

jobs:
  backend:
    name: Backend migration and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutorlink_test
          POSTGRES_USER: tutorlink
          POSTGRES_PASSWORD: tutorlink_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tutorlink -d tutorlink_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend
        shell: bash

    env:
      APP_NAME: TutorLink
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000

      APP_CONFIG_CACHE: /tmp/tutorlink-ci-config.php
      TEST_CONFIG_CACHE: /tmp/tutorlink-ci-config.php

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: tutorlink_test
      DB_USERNAME: tutorlink
      DB_PASSWORD: tutorlink_ci_password
      DB_URL: ""

      CACHE_STORE: array
      SESSION_DRIVER: database
      SESSION_COOKIE: tutorlink-session
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: "null"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, zip, pdo_pgsql, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Prepare runtime and evidence directories
        run: |
          mkdir -p storage/framework/cache \
                   storage/framework/sessions \
                   storage/framework/views \
                   bootstrap/cache \
                   build/reports
          chmod -R ug+rw storage bootstrap/cache
          touch .env

      - name: Record runtime and commit
        run: |
          git rev-parse HEAD > build/reports/commit.txt
          php -v > build/reports/runtime.txt
          composer --version >> build/reports/runtime.txt
          php --ri pcov >> build/reports/runtime.txt

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer show --locked > build/reports/dependencies.txt

      - name: Backend lint
        run: |
          vendor/bin/pint --test 2>&1 | tee build/reports/format.txt

      - name: Validate test database guard and migrations
        run: |
          php scripts/test-console.php check \
            2>&1 | tee build/reports/database-guard.txt
          php scripts/test-console.php migrate \
            2>&1 | tee build/reports/migrations.txt

      - name: Run backend tests with coverage
        run: |
          php scripts/test-suite.php --coverage \
            2>&1 | tee build/reports/tests.txt

          test -s build/reports/clover.xml
          for group in d04-preflight regression d04 d04-race; do
            test -s "build/reports/$group-junit.xml"
          done
          test -s build/reports/coverage.txt

      - name: Export OpenAPI from guarded PostgreSQL test schema
        run: php scripts/test-console.php openapi:export

      - name: Set up Node for OpenAPI validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI contract
        run: |
          npx --yes @redocly/cli@2.60.0 lint \
            ../docs/api/openapi.json \
            --config ../.redocly.yaml

      - name: Verify OpenAPI matches registered routes
        run: php scripts/verify-openapi-routes.php

      - name: Check committed OpenAPI is current
        run: |
          git ls-files --error-unmatch ../docs/api/openapi.json
          git diff --exit-code -- ../docs/api/openapi.json

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/build/reports/
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests and coverage
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=coverage/junit.xml

      - name: Build
        run: npm run build

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: warn
