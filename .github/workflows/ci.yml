name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend migration and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tutorlink
          POSTGRES_USER: tutorlink
          POSTGRES_PASSWORD: tutorlink_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tutorlink -d tutorlink"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tutorlink
      DB_USERNAME: tutorlink
      DB_PASSWORD: tutorlink_ci_password
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p storage/framework/cache \
                  storage/framework/sessions \
                  storage/framework/views \
                  bootstrap/cache
          chmod -R ug+rw storage bootstrap/cache

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate PostgreSQL migrations
        run: php artisan migrate --force
      - name: Run backend tests
        run: php artisan test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml
